    - podSelector:
        matchLabels:
          application: designate
    - podSelector:
        matchLabels:
          application: horizon
    - podSelector:
        matchLabels:
          application: ironic
    - podSelector:
        matchLabels:
          application: magnum
    - podSelector:
        matchLabels:
          application: mistral
    - podSelector:
        matchLabels:
          application: nova
    - podSelector:
        matchLabels:
          application: neutron
    - podSelector:
        matchLabels:
