          name: mysql-data
      initContainers:
      - command:
        - kubernetes-entrypoint
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: INTERFACE_NAME
          value: eth0
        - name: PATH
          value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/
        - name: DEPENDENCY_SERVICE
          value: ""
        - name: DEPENDENCY_DAEMONSET
          value: ""
        - name: DEPENDENCY_CONTAINER
          value: ""
        - name: DEPENDENCY_POD_JSON
          value: ""
        - name: DEPENDENCY_CUSTOM_RESOURCE
          value: ""
        image: quay.io/airshipit/kubernetes-entrypoint:latest-ubuntu_noble
        imagePullPolicy: IfNotPresent
        name: init
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 65534
        volumeMounts: []
      - args:
        - set -xe; /bin/chown -R "mysql:mysql" /var/lib/mysql; /bin/chmod 700 /var/lib/mysql;
        command:
        - /bin/sh
        - -c
        image: quay.io/airshipit/mariadb:latest-ubuntu_noble
        imagePullPolicy: IfNotPresent
        name: mariadb-perms
        securityContext:
          readOnlyRootFilesystem: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /tmp
          name: pod-tmp
        - mountPath: /var/lib/mysql
          name: mysql-data
      nodeSelector:
        openstack-control-plane: enabled
      securityContext:
        runAsUser: 999
      serviceAccountName: mariadb-mariadb
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 600
      volumes:
      - emptyDir: {}
        name: pod-tmp
      - emptyDir: {}
        name: mycnfd
      - emptyDir: {}
        name: var-run
      - configMap:
          defaultMode: 365
          name: mariadb-bin
        name: mariadb-bin
      - configMap:
          defaultMode: 292
          name: mariadb-etc
        name: mariadb-etc
      - name: mariadb-secrets
        secret:
          defaultMode: 292
          secretName: mariadb-secrets
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: general
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mariadb-server
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: mariadb
      app.kubernetes.io/name: mariadb
      application: mariadb
      component: server
      release_group: mariadb
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-admin-client-config
  namespace: openstack
spec:
  data:
  - remoteRef:
      key: kv/underdark/openstack/mariadb-admin
      property: password
    secretKey: password
  refreshInterval: 1h0m0s
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-backend
  target:
    name: mariadb-secrets
    template:
      data:
        admin_user.cnf: |
          [client]
          user = root
          password = {{ .password }}
          host = mariadb-server
          port = 3306
        admin_user_internal.cnf: |
          [client]
          user = root
          password = {{ .password }}
          host = mariadb.openstack
          port = 3306
      engineVersion: v2
---
apiVersion: external-secrets.io/v1
