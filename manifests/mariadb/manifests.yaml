kind: ConfigMap
metadata:
  name: mariadb-bin
---
apiVersion: v1
data:
  00-base.cnf: "[mysqld]\n# Charset\ncharacter_set_server=utf8\ncollation_server=utf8_general_ci\nskip-character-set-client-handshake\n\n#
    Logging\nslow_query_log=off\nslow_query_log_file=/var/log/mysql/mariadb-slow.log\nlog_warnings=2\n\n#
    General logging has huge performance penalty therefore is disabled by default\ngeneral_log=off\ngeneral_log_file=/var/log/mysql/mariadb-error.log\n\nlong_query_time=3\nlog_queries_not_using_indexes=on\n\n#
    Networking\nbind_address=0.0.0.0\nport=3306\n\n# When a client connects, the server
    will perform hostname resolution,\n# and when DNS is slow, establishing the connection
    will become slow as well.\n# It is therefore recommended to start the server with
    skip-name-resolve to\n# disable all DNS lookups. The only limitation is that the
    GRANT statements\n# must then use IP addresses only.\nskip_name_resolve\n\n# Tuning\nuser=mysql\nmax_allowed_packet=256M\nopen_files_limit=10240\nmax_connections=8192\nmax-connect-errors=1000000\n\n#
    General security settings\n# Reference: https://dev.mysql.com/doc/mysql-security-excerpt/8.0/en/general-security-issues.html\n#
    secure_file_priv is set to '/home' because it is read-only, which will\n# disable
    this feature completely.\nsecure_file_priv=/home\nlocal_infile=0\nsymbolic_links=0\nsql_mode=\"STRICT_ALL_TABLES,STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION\"\n\n\n##
    Generally, it is unwise to set the query cache to be larger than 64-128M\n## as
    the costs associated with maintaining the cache outweigh the performance\n## gains.\n##
    The query cache is a well known bottleneck that can be seen even when\n## concurrency
    is moderate. The best option is to disable it from day 1\n## by setting query_cache_size=0
    (now the default on MySQL 5.6)\n## and to use other ways to speed up read queries:
    good indexing, adding\n## replicas to spread the read load or using an external
    cache.\nquery_cache_size=0\nquery_cache_type=0\n\nsync_binlog=0\nthread_cache_size=16\ntable_open_cache=2048\ntable_definition_cache=1024\n\n#\n#
    InnoDB\n#\n# The buffer pool is where data and indexes are cached: having it as
    large as possible\n# will ensure you use memory and not disks for most read operations.\n#
    Typical values are 50..75% of available RAM.\n# TODO(tomasz.paszkowski): This
    needs to by dynamic based on available RAM.\ninnodb_buffer_pool_size=1024M\ninnodb_doublewrite=0\ninnodb_file_format=Barracuda\ninnodb_file_per_table=1\ninnodb_flush_method=O_DIRECT\ninnodb_io_capacity=500\ninnodb_locks_unsafe_for_binlog=1\ninnodb_log_file_size=128M\ninnodb_old_blocks_time=1000\ninnodb_read_io_threads=8\ninnodb_write_io_threads=8\n\n#
    Clustering\nbinlog_format=ROW\ndefault-storage-engine=InnoDB\ninnodb_autoinc_lock_mode=2\ninnodb_flush_log_at_trx_commit=2\nwsrep_cluster_name=mariadb-server_openstack\nwsrep_on=1\nwsrep_provider=/usr/lib/galera/libgalera_smm.so\nwsrep_provider_options=\"evs.suspect_timeout=PT30S;
    gmcast.peer_timeout=PT15S; gmcast.listen_addr=tcp://0.0.0.0:4567\"\nwsrep_slave_threads=12\nwsrep_sst_auth=sst:password\nwsrep_sst_method=mariabackup\n\n\n\n\n[mysqldump]\nmax-allowed-packet=16M\n\n[client]\ndefault_character_set=utf8\nprotocol=tcp\nport=3306\n
    \ \n"
  99-force.cnf: |
    [mysqld]
    datadir=/var/lib/mysql
    tmpdir=/tmp
  my.cnf: "[mysqld]\ndatadir=/var/lib/mysql\nbasedir=/usr\nignore-db-dirs=lost+found\n\n[client-server]\n!includedir
    /etc/mysql/conf.d/  \n"
