---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-admin-client-config
spec:
  data:
    - secretKey: password
      remoteRef:
        key: kv/underdark/openstack/mariadb-admin
        property: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-backend
  target:
    name: mariadb-secrets
    template:
      engineVersion: v2
      data:
        admin_user.cnf: |
          [client]
          user = root
          password = {{ .password }}
          host = mariadb-server
          port = 3306
        admin_user_internal.cnf: |
          [client]
          user = root
          password = {{ .password }}
          host = mariadb.openstack
          port = 3306
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
