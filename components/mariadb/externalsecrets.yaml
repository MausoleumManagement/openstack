apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-dbadmin-password
spec:
  data:
    - secretKey: MYSQL_DBADMIN_PASSWORD
      remoteRef:
        key: kv/underdark/openstack/mariadb-admin
        property: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-backend
  target:
    name: mariadb-dbadmin-password
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-state-transfer-password
spec:
  data:
    - secretKey: MYSQL_DBSST_PASSWORD
      remoteRef:
        key: kv/underdark/openstack/mariadb-state-snapshot-transfer-user
        property: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-backend
  target:
    name: mariadb-dbsst-password
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-audit-password
spec:
  data:
    - secretKey: MYSQL_DBAUDIT_PASSWORD
      remoteRef:
        key: kv/underdark/openstack/mariadb-audit-user
